[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True
check_untyped_defs = True
no_implicit_optional = True

# PySide6's stubs expose QApplication.instance() as QCoreApplication and omit
# enum aliases that are valid at runtime. Pandas also changes header overloads
# by branch. These boundary modules are covered by runtime tests instead.
[mypy-excel_studio.ui.*]
ignore_errors = True

[mypy-excel_studio.app.*]
ignore_errors = True

[mypy-excel_studio.config.settings]
ignore_errors = True

[mypy-excel_studio.services.table_reader]
ignore_errors = True

[mypy-excel_studio.services.file_scanner]
ignore_errors = True

[mypy-excel_studio.services.report_service]
ignore_errors = True

[mypy-excel_studio.services.advanced_merge_engine.*]
ignore_errors = True

