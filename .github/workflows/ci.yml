name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,legacy]"
      - name: Test
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Mypy
        run: python -m mypy --config-file mypy-final.ini src/excel_studio
      - name: Portable source smoke test
        run: |
          python scripts/build_single_file.py
          python Excel_Split_Merge_Studio.py --smoke-test --config-dir .runtime/portable
